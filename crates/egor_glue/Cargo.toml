[package]
name = "egor_glue"
version = "0.10.0"
edition = "2024"
description = "High-level wrappers around low-level egor crates"
repository = "https://github.com/wick3dr0se/egor"
license = "MIT"
keywords = ["egor"]

[dependencies]
egor_app = { path = "../egor_app", version = "0.10.0" }
egor_render = { path = "../egor_render", version = "0.10.0" }

color = "0.3.1"
egui = { version = "0.34.1", optional = true }
egui-wgpu = { version = "0.34.1", default-features = false, optional = true }
egui-winit = { version = "0.34.1", default-features = false, optional = true }
glam = "0.32.1"
glyphon = "0.11.0"
lyon = { version = "1.0.16" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus-devtools = { version = "0.8.0-alpha.0", optional = true }

[features]
default = []
hot_reload = ["dep:dioxus-devtools"]
ui = ["dep:egui", "dep:egui-wgpu", "dep:egui-winit"]
