[package]
name = "egor_app"
version = "0.10.0"
edition = "2024"
description = "Standalone runtime for building interactive Rust applications"
repository = "https://github.com/wick3dr0se/egor"
license = "MIT"
keywords = ["egor"]

[dependencies]
log = { version = "0.4.27", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { version = "0.11.8", optional = true }
pollster = "0.4.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
winit = "0.30.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { version = "0.1.7", optional = true }
console_log = { version = "1.0.0", optional = true }
wasm-bindgen-futures = "0.4.50"
web-sys = { version = "0.3.77", features = ["Performance", "Window"] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.12", features = ["android-native-activity"] }

[features]
default = []
log = [
  "dep:console_error_panic_hook",
  "dep:console_log",
  "dep:env_logger",
  "dep:log",
]
